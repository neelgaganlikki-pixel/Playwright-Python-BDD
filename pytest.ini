[pytest]
testpaths = tests
bdd_features_base_dir = features
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: Critical path smoke tests
    regression: Comprehensive regression suite
    login: Authentication tests
    employee: Employee management (PIM) tests
    leave: Leave management tests
    recruitment: Recruitment and candidate tests
    buzz: Buzz social feed tests
    timesheet: Time and attendance weekly timesheet tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin\.gherkin_line
